<body>
    <!-- GitHub Pages to Google Apps Script Bridge -->
    <script>
        // =========================================================================
        // ⚙️ GOOGLE APPS SCRIPT WEB APP URL
        // Replace this URL with your deployed Google Apps Script Web App URL:
        // Example: "https://script.google.com/macros/s/AKfycbx.../exec"
        // =========================================================================
        const APPS_SCRIPT_URL = "YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";

        /**
         * Universal executeGasCall function
         * Maps google.script.run function names to Apps Script Web App GET / POST endpoints
         */
        async function executeGasCall(funcName, args) {
            // Write actions: processData (STOCK_IN, STOCK_OUT, TRANSFER), updateRecord, deleteRecord
            if (funcName === 'processData') {
                const rawPayload = args[0];
                const payload = typeof rawPayload === 'string' ? JSON.parse(rawPayload) : rawPayload;
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight
                    body: JSON.stringify(payload)
                });
                return await response.json();
            }

            if (funcName === 'updateRecord') {
                const [sheetName, rowNumber, updatedValues] = args;
                const payload = {
                    action: 'updateRecord',
                    sheetName: sheetName,
                    rowNumber: rowNumber,
                    updatedValues: typeof updatedValues === 'string' ? JSON.parse(updatedValues) : updatedValues
                };
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                return await response.json();
            }

            if (funcName === 'deleteRecord') {
                const [sheetName, rowNumber] = args;
                const payload = {
                    action: 'deleteRecord',
                    sheetName: sheetName,
                    rowNumber: rowNumber
                };
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                return await response.json();
            }

            // Read actions: GET requests
            const params = new URLSearchParams();
            params.append('action', funcName);

            if (funcName === 'getTodayLog') {
                params.append('sheet', args[0] || 'SalesLog');
            } else if (funcName === 'getLogsByDateRange') {
                params.append('sheet', args[0] || '');
                params.append('fromDate', args[1] || '');
                params.append('toDate', args[2] || '');
            } else if (funcName === 'searchRecords') {
                params.append('sheet', args[0] || '');
                params.append('party', args[1] || '');
                params.append('product', args[2] || '');
                params.append('fromDate', args[3] || '');
                params.append('toDate', args[4] || '');
            } else if (funcName === 'getProductsFromSheet' || funcName === 'getPartiesFromSheet') {
                params.append('sheet', args[0] || '');
            } else if (funcName === 'getTallyStockReport' || funcName === 'getDailyStockLedger') {
                params.append('fromDate', args[0] || '');
                params.append('toDate', args[1] || '');
                params.append('warehouse', args[2] || 'All');
                params.append('mill', args[3] || '');
                params.append('product', args[4] || '');
            }

            const url = APPS_SCRIPT_URL + (APPS_SCRIPT_URL.includes('?') ? '&' : '?') + params.toString();
            const response = await fetch(url);
            // Returns raw text string so that JSON.parse(res) inside existing handlers works seamlessly
            return await response.text();
        }

        /**
         * Drop-in google.script.run proxy bridge
         */
        window.google = {
            script: {
                get run() {
                    let successHandler = () => {};
                    let failureHandler = (err) => console.error(err);

                    const handler = {
                        get(target, prop) {
                            if (prop === 'withSuccessHandler') {
                                return function(fn) {
                                    successHandler = fn;
                                    return new Proxy({}, handler);
                                };
                            }
                            if (prop === 'withFailureHandler') {
                                return function(fn) {
                                    failureHandler = fn;
                                    return new Proxy({}, handler);
                                };
                            }
                            return function(...args) {
                                if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL === "YOUR_APPS_SCRIPT_WEB_APP_URL_HERE") {
                                    const errMsg = "Apps Script URL configure nahi hai! index.html me APPS_SCRIPT_URL replace karein.";
                                    console.warn(errMsg);
                                    if (typeof Swal !== 'undefined') {
                                        Swal.fire({
                                            icon: 'warning',
                                            title: 'Web App URL Missing',
                                            text: 'index.html me APPS_SCRIPT_URL update karein taaki Google Sheets se connect ho sake.',
                                            background: '#0f172a',
                                            color: '#fff'
                                        });
                                    }
                                    failureHandler(new Error(errMsg));
                                    return;
                                }
                                executeGasCall(prop, args)
                                    .then(data => successHandler(data))
                                    .catch(err => {
                                        console.error("API Call Error (" + prop + "):", err);
                                        failureHandler(err);
                                    });
                            };
                        }
                    };

                    return new Proxy({}, handler);
                }
            }
        };
    </script>

    <div id="root"></div>

    <script type="text/babel" data-presets="react,env" data-type="module">
        const { useState, useEffect, useMemo, useRef } = React;
        const WAREHOUSES = ["Khera Kalan", "Mukherjee Nagar", "By Truck"];
        const SALES_PERSONS = ["Chandresh Sale", "Dilip Sale", "Mr. Mukesh", "Mr. Pawan", "Mr. Pranav", "Mr. Rishabh", "Mr. Sonu"];
        const LOGO_URL = "https://lh3.googleusercontent.com/d/1yncNH52_uB8UKEaz6ut1eoqqMwN0gnEl";

        // ── System-wide number formatting ────────────────────────────────────
        function n2(value, forceMoney) {
            const num = Number(value);
            if (!isFinite(num)) return value;
            const rounded = Math.round((num + Number.EPSILON) * 100) / 100;
            return forceMoney ? rounded.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : rounded;
        }

        function fmtCell(v) { return typeof v === 'number' ? n2(v) : v; }

        const Toast = Swal.mixin({
            toast: true, position: 'bottom', showConfirmButton: false, timer: 2500, timerProgressBar: true,
            background: '#0f172a', color: '#ffffff',
            didOpen: (toast) => { toast.addEventListener('mouseenter', Swal.stopTimer); toast.addEventListener('mouseleave', Swal.resumeTimer); }
        });

        function App() {
            const [ledgerData, setLedgerData] = useState([]);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [dashData, setDashData] = useState({ items: [], totalValue: 0 });
            const [selectedWH, setSelectedWH] = useState(WAREHOUSES[0]);
            const [masterItems, setMasterItems] = useState([]);
            const [parties, setParties] = useState([]);
            const [orderItems, setOrderItems] = useState([]);
            const [logModal, setLogModal] = useState({ show: false, title: '', data: [] });
            const [searchQuery, setSearchQuery] = useState('');
            const [partySearch, setPartySearch] = useState('');
            const [showResults, setShowResults] = useState(false);
            const [showParties, setShowParties] = useState(false);

            const [btnLoad, setBtnLoad] = useState({
                todayPurchase: false, todaySales: false, todayTransfer: false,
                histPurchase: false, histSales: false, histTransfer: false,
                summary: false, ledger: false, modifySearch: false,
                saveTxn: false, saveEdit: false, dlCsv: false, dlPdf: false,
                dlLedger: false, dlSummary: false
            });
            const setBtn = (k, v) => setBtnLoad(prev => ({ ...prev, [k]: v }));

            const [historyFromDate, setHistoryFromDate] = useState(new Date().toISOString().split('T')[0]);
            const [historyToDate, setHistoryToDate] = useState(new Date().toISOString().split('T')[0]);
            const [modifySheet, setModifySheet] = useState('SalesLog');
            const [modifyParty, setModifyParty] = useState('');
            const [modifyProduct, setModifyProduct] = useState('');
            const [modifyFromDate, setModifyFromDate] = useState('');
            const [modifyToDate, setModifyToDate] = useState('');
            const [modifyResults, setModifyResults] = useState([]);
            const [editingRow, setEditingRow] = useState(null);
            const [editValues, setEditValues] = useState({});
            const [sheetParties, setSheetParties] = useState([]);
            const [sheetProducts, setSheetProducts] = useState([]);
            const [showModifyPartyDD, setShowModifyPartyDD] = useState(false);
            const [showModifyProductDD, setShowModifyProductDD] = useState(false);
            const [showEditProductDD, setShowEditProductDD] = useState(false);
            const [showEditPartyDD, setShowEditPartyDD] = useState(false);
            const [showEditMillDD, setShowEditMillDD] = useState(false);
            const modifyResultsRef = useRef(null);
            const [reportData, setReportData] = useState([]);
            const [repFilters, setRepFilters] = useState({ from: new Date().toISOString().split('T')[0], to: new Date().toISOString().split('T')[0], wh: 'All' });

            const [globalSearch, setGlobalSearch] = useState('');
            const [showGlobalDD, setShowGlobalDD] = useState(false);
            const [showPartyRepDD, setShowPartyRepDD] = useState(false);
            const [globalResults, setGlobalResults] = useState([]);
            const [globalLoading, setGlobalLoading] = useState(false);
            const [partyReport, setPartyReport] = useState([]);
            const [partyRepFilters, setPartyRepFilters] = useState({ from: new Date().toISOString().split('T')[0], to: new Date().toISOString().split('T')[0], party: '' });
            const [partyRepLoading, setPartyRepLoading] = useState(false);

            const [formData, setFormData] = useState({
                date: new Date().toISOString().split('T')[0], warehouse: '', toWarehouse: '',
                mill: '', product: '', qty: '', price: '', billType: 'GST',
                salesPerson: '', partyName: '', padNo: '', billNo: '', netBillNo: '',
                discount: '0', freight: '0', freightRecovered: 'No',
                insurance: '0', cartage: '0', loading: '0'
            });

            const isNetMode = formData.billType === 'NON-GST';
            const isConfigured = APPS_SCRIPT_URL && APPS_SCRIPT_URL !== "YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";

            // ── Reports ─────────────────────────────────────────────────────────
            const fetchTallyReport = () => {
                setBtn('summary', true);
                if (typeof google !== 'undefined') {
                    google.script.run
                        .withSuccessHandler(res => {
                            const data = JSON.parse(res);
                            setReportData(data); setBtn('summary', false);
                            if (data.length === 0) Toast.fire({ icon: 'info', title: 'No transactions found!' });
                            else Toast.fire({ icon: 'success', title: data.length + ' products loaded' });
                        })
                        .withFailureHandler(err => { setBtn('summary', false); Toast.fire({ icon: 'error', title: err.message }); })
                        .getTallyStockReport(repFilters.from, repFilters.to, repFilters.wh);
                }
            };

            const fetchLedger = () => {
                if (!formData.product) return Toast.fire({ icon: 'warning', title: 'Select Product!' });
                setBtn('ledger', true);
                if (typeof google !== 'undefined') {
                    google.script.run
                        .withSuccessHandler(res => {
                            const data = JSON.parse(res);
                            setLedgerData(data); setBtn('ledger', false);
                            if (data.length === 0) Toast.fire({ icon: 'info', title: 'No transactions found!' });
                            else Toast.fire({ icon: 'success', title: data.length + ' rows loaded' });
                        })
                        .withFailureHandler(err => { setBtn('ledger', false); Toast.fire({ icon: 'error', title: err.message }); })
                        .getDailyStockLedger(repFilters.from, repFilters.to, repFilters.wh, formData.mill, formData.product);
                }
            };

            const downloadStockReportExcel = () => {
                if (reportData.length === 0) return Toast.fire({ icon: 'warning', title: 'Load report first!' });
                setBtn('dlSummary', true);
                let html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"><style>table{border-collapse:collapse;} th,td{border:1px solid #cbd5e1;padding:6px 10px;text-align:center;font-weight:bold;} th{background-color:#1e293b;color:white;text-transform:uppercase;} .text-left{text-align:left;}</style></head><body>`;
                html += `<table><tr><td colspan="6" style="border:none;text-align:left;font-size:14px;">SATIJA PAPER - STOCK SUMMARY (${repFilters.from} to ${repFilters.to})</td></tr><tr><td colspan="6" style="border:none;text-align:left;">Warehouse: ${repFilters.wh}</td></tr><tr><td colspan="6" style="border:none;"></td></tr>`;
                html += '<tr><th>Mill</th><th>Product</th><th>Opening Qty</th><th>Inwards Qty</th><th>Outwards Qty</th><th>Closing Qty</th></tr>';
                reportData.forEach(r => { html += `<tr><td class="text-left">${r.mill}</td><td class="text-left">${r.product}</td><td>${n2(r.opQty)}</td><td>${n2(r.inQty)}</td><td>${n2(r.outQty)}</td><td>${n2(r.clQty)}</td></tr>`; });
                html += '</table></body></html>';
                const blob = new Blob([html], { type: 'application/vnd.ms-excel;charset=utf-8;' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Stock_Summary_${repFilters.from}_to_${repFilters.to}.xls`; a.click();
                Toast.fire({ icon: 'success', title: 'Excel Downloaded!' });
                setBtn('dlSummary', false);
            };

            const downloadLedgerPDF = () => {
                if (ledgerData.length === 0) return Toast.fire({ icon: 'warning', title: 'Load Ledger first!' });
                setBtn('dlLedger', true);
                const grouped = {};
                ledgerData.forEach(row => {
                    const dKey = row.dateSort || row.date;
                    if (!grouped[dKey]) grouped[dKey] = { date: row.date, warehouses: {} };
                    if (!grouped[dKey].warehouses[row.warehouse]) grouped[dKey].warehouses[row.warehouse] = [];
                    grouped[dKey].warehouses[row.warehouse].push(row);
                });
                let html = '<html><head><meta charset="UTF-8"><style>body{font-family:Arial,sans-serif;font-size:10px;padding:20px;color:#000;}.header{text-align:center;margin-bottom:15px;border-bottom:3px solid #2563eb;padding-bottom:10px;}.header h1{font-size:22px;margin:0;font-weight:900;text-transform:uppercase;letter-spacing:3px;color:#1e40af;}.info{text-align:center;font-size:11px;color:#666;margin-bottom:20px;}.date-block{margin-bottom:25px;page-break-inside:avoid;}.date-title{background:#0f172a;color:#fff;padding:10px 15px;font-size:13px;font-weight:900;text-transform:uppercase;border-radius:6px 6px 0 0;}.wh-title{background:#e0e7ff;color:#1e3a8a;padding:7px 15px;font-size:11px;font-weight:900;text-transform:uppercase;border-left:4px solid #2563eb;}table{width:100%;border-collapse:collapse;margin-bottom:10px;}th,td{border:1px solid #333;padding:6px 10px;text-align:center;}th{background:#f1f5f9;font-weight:900;text-transform:uppercase;font-size:9px;}@media print{@page{size:A4;margin:10mm;}}</style></head><body>';
                html += '<div class="header"><h1>Satija Paper</h1><h2>Daily Stock Ledger</h2></div>';
                html += `<div class="info"><b>Product:</b> ${formData.mill} — ${formData.product}   |   <b>Period:</b> ${repFilters.from} to ${repFilters.to}</div>`;
                Object.keys(grouped).sort().forEach(dKey => {
                    const block = grouped[dKey]; html += '<div class="date-block"><div class="date-title">📅 Date: ' + block.date + '</div>';
                    Object.keys(block.warehouses).forEach(wh => {
                        html += '<div class="wh-title">🏬 Warehouse: ' + wh + '</div><table><thead><tr><th>Opening Qty</th><th>Inward (+)</th><th>Outward (-)</th><th>Closing Qty</th></tr></thead><tbody>';
                        block.warehouses[wh].forEach(r => { html += `<tr><td>${n2(r.opQty)}</td><td>+${n2(r.inQty)}</td><td>-${n2(r.outQty)}</td><td><b>${n2(r.clQty)}</b></td></tr>`; });
                        html += '</tbody></table>';
                    });
                    html += '</div>';
                });
                html += '</body></html>';
                const win = window.open('', '_blank', 'width=1100,height=700'); win.document.write(html); win.document.close();
                setTimeout(() => { win.print(); win.close(); setBtn('dlLedger', false); }, 600);
            };

            const downloadLedgerCSV = () => {
                if (ledgerData.length === 0) return Toast.fire({ icon: 'warning', title: 'Pehle Ledger load karein!' });
                const uniqueDates = [...new Set(ledgerData.map(r => r.date))].sort();
                let htmlWorkbook = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><style>table { border-collapse: collapse; } th,td { border: 1px solid #cbd5e1; text-align: center; font-weight: bold; } th { background-color: #1e293b; color: white; }</style></head><body>`;
                uniqueDates.forEach(date => {
                    htmlWorkbook += `<table id="sheet_${date.replace(/[^a-zA-Z0-9]/g, '_')}" style="margin-bottom:40px;"><tr><td colspan="5" style="border:none; text-align:left; font-size:14px; font-weight:bold;">SATIJA PAPER - STOCK LEDGER: ${date}</td></tr><tr><td colspan="5" style="border:none;">Product: ${formData.mill} - ${formData.product}</td></tr><tr><td colspan="5" style="border:none;"></td></tr><thead><tr><th>Warehouse</th><th>Opening Qty</th><th>Inward (+)</th><th>Outward (-)</th><th>Closing Qty</th></tr></thead><tbody>`;
                    ledgerData.filter(r => r.date === date).forEach(r => { htmlWorkbook += `<tr><td style="text-align:left;">${r.warehouse}</td><td>${n2(r.opQty)}</td><td>+${n2(r.inQty)}</td><td>-${n2(r.outQty)}</td><td>${n2(r.clQty)}</td></tr>`; });
                    htmlWorkbook += `</tbody></table>`;
                });
                htmlWorkbook += `</body></html>`;
                const blob = new Blob([htmlWorkbook], { type: 'application/vnd.ms-excel;charset=utf-8;' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Ledger_' + formData.product.replace(/[^a-zA-Z0-9]/g, '_') + '_Datewise.xls'; a.click(); Toast.fire({ icon: 'success', title: 'Workbook Downloaded!' });
            };

            const downloadExcelCSV = () => {
                if (!logModal.data || logModal.data.length === 0) return; setBtn('dlCsv', true);
                const headers = logModalColumns;
                let csv = headers.join(',') + '\n';
                logModal.data.forEach(row => { csv += headers.map(h => { const v = fmtCell(row[h]); return '"' + (v !== undefined && v !== null ? v.toString().replace(/"/g, '""') : '') + '"'; }).join(',') + '\n'; });
                const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = (logModal.title || 'history').replace(/[^a-zA-Z0-9]/g, '_') + '.csv'; a.click(); setBtn('dlCsv', false);
            };

            const downloadPDF = () => {
                if (!logModal.data || logModal.data.length === 0) return; setBtn('dlPdf', true);
                const headers = logModalColumns;
                let tableHtml = '<html><head><meta charset="UTF-8"><style>body{font-family:Arial,sans-serif;font-size:10px;padding:20px;} table{width:100%;border-collapse:collapse;margin-top:10px;} th,td{border:1px solid #333;padding:6px 8px;text-align:left;white-space:nowrap;} th{background:#1e293b;color:white;font-weight:bold;text-transform:uppercase;} @media print{@page{size:landscape;margin:8mm;}}</style></head><body>';
                tableHtml += `<div style="text-align:center"><h1>Satija Paper</h1><h2>${logModal.title || 'Report'}</h2></div><table><thead><tr>` + headers.map(h => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>';
                logModal.data.forEach(row => { tableHtml += '<tr>' + headers.map(h => { const v = fmtCell(row[h]); return '<td>' + (v !== undefined && v !== null ? v : '-') + '</td>'; }).join('') + '</tr>'; });
                tableHtml += '</tbody></table></body></html>';
                const win = window.open('', '_blank'); win.document.write(tableHtml); win.document.close();
                setTimeout(() => { win.print(); win.close(); setBtn('dlPdf', false); }, 600);
            };

            // ── Party Report Excel download ──────────────────────────────────────
            const downloadPartyReportExcel = () => {
                if (partyReport.length === 0) return Toast.fire({ icon: 'warning', title: 'Load report first!' });
                let html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"><style>table{border-collapse:collapse;} th,td{border:1px solid #cbd5e1;padding:6px 10px;text-align:center;font-weight:bold;} th{background-color:#1e293b;color:white;text-transform:uppercase;} .text-left{text-align:left;}</style></head><body>`;
                html += `<table><tr><td colspan="6" style="border:none;text-align:left;font-size:14px;">SATIJA PAPER - PARTY-WISE SALES (${partyRepFilters.from} to ${partyRepFilters.to})</td></tr><tr><td colspan="6" style="border:none;"></td></tr>`;
                html += '<tr><th>#</th><th>Party Name</th><th>Bills</th><th>Total Qty</th><th>Total Amount</th><th>Total Profit</th></tr>';
                partyReport.forEach((p, i) => { html += `<tr><td>${i + 1}</td><td class="text-left">${p.party}</td><td>${p.bills}</td><td>${n2(p.totalQty)}</td><td>${p.totalAmt.toFixed(2)}</td><td>${p.totalProfit.toFixed(2)}</td></tr>`; });
                html += '</table></body></html>';
                const blob = new Blob([html], { type: 'application/vnd.ms-excel;charset=utf-8;' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Party_Report_${partyRepFilters.from}_to_${partyRepFilters.to}.xls`; a.click();
                Toast.fire({ icon: 'success', title: 'Excel Downloaded!' });
            };

            // ── Data loading ─────────────────────────────────────────────────────
            useEffect(() => { refreshData(); }, []);
            useEffect(() => {
                if (activeTab === 'modify' && typeof google !== 'undefined') {
                    google.script.run.withSuccessHandler(res => setSheetParties(JSON.parse(res))).getPartiesFromSheet(modifySheet);
                    google.script.run.withSuccessHandler(res => setSheetProducts(JSON.parse(res))).getProductsFromSheet(modifySheet);
                }
            }, [activeTab, modifySheet]);
            useEffect(() => { if (modifyResults.length > 0 && modifyResultsRef.current) modifyResultsRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, [modifyResults]);

            const [refreshing, setRefreshing] = useState(false);
            const refreshData = (showStatus = false) => {
                if (typeof google === 'undefined') return;
                if (!isConfigured) return;
                if (showStatus) { setRefreshing(true); Toast.fire({ icon: 'info', title: '↻ Refreshing data...' }); }
                let done = 0;
                const finish = () => { done++; if (done === 3) { setRefreshing(false); if (showStatus) Toast.fire({ icon: 'success', title: '✅ Data Refreshed!' }); } };
                const fail = (err) => { done++; if (done === 3) setRefreshing(false); if (showStatus) Toast.fire({ icon: 'error', title: 'Refresh failed: ' + err.message }); };
                google.script.run.withSuccessHandler(res => { setMasterItems(JSON.parse(res)); finish(); }).withFailureHandler(fail).getProductMasterList();
                google.script.run.withSuccessHandler(res => { setDashData(JSON.parse(res)); finish(); }).withFailureHandler(fail).getDashboardData();
                google.script.run.withSuccessHandler(res => { setParties(JSON.parse(res)); finish(); }).withFailureHandler(fail).getPartyList();
            };

            const showTodayEntries = (type, baseSheetName, btnKey) => {
                setBtn(btnKey, true);
                if (typeof google !== 'undefined') {
                    google.script.run
                        .withSuccessHandler(res => {
                            let parsedData = []; try { parsedData = JSON.parse(res); } catch(e) {}
                            if (!parsedData || parsedData.length === 0) Toast.fire({ icon: 'info', title: 'No entries for today!' });
                            setLogModal({ show: true, title: "Today's " + type, data: parsedData || [] }); setBtn(btnKey, false);
                        })
                        .withFailureHandler(err => { setBtn(btnKey, false); Toast.fire({ icon: 'error', title: err.message }); })
                        .getTodayLog(baseSheetName);
                }
            };

            const fetchHistoryRange = (type, baseSheetName, btnKey) => {
                if (historyFromDate > historyToDate) return Toast.fire({ icon: 'warning', title: 'From Date should be before To Date!' });
                setBtn(btnKey, true);
                google.script.run.withSuccessHandler(res => {
                    let data = []; try { data = JSON.parse(res); } catch(e) {}
                    if (data.length === 0) Toast.fire({ icon: 'info', title: 'No Record Found' });
                    setLogModal({ show: true, title: type + ' (' + historyFromDate + ' to ' + historyToDate + ')', data }); setBtn(btnKey, false);
                }).withFailureHandler(err => { setBtn(btnKey, false); Toast.fire({ icon: 'error', title: err.message }); }).getLogsByDateRange(baseSheetName, historyFromDate, historyToDate);
            };

            // ── Memos ────────────────────────────────────────────────────────────
            const filteredItems = useMemo(() => {
                if (!searchQuery) return [];
                return masterItems.filter(item => item.label.toLowerCase().includes(searchQuery.toLowerCase())).slice(0, 8);
            }, [searchQuery, masterItems]);

            const tableData = useMemo(() => dashData.items.filter(item => item.warehouse === selectedWH), [selectedWH, dashData.items]);

            const itemStats = useMemo(() => dashData.items.find(i => i.product === formData.product && i.warehouse === formData.warehouse && i.mill === formData.mill) || { qty: 0, avgGST: 0, avgNonGST: 0 }, [formData.product, formData.warehouse, formData.mill, dashData.items]);

            // Price Freeze indicator: stock 0 hai lekin last rate saved hai (frozen)
            const isFrozenRate = useMemo(() => (Number(itemStats.qty) || 0) === 0 && ((Number(itemStats.avgGST) || 0) > 0 || (Number(itemStats.avgNonGST) || 0) > 0), [itemStats]);

            const currentTotal = useMemo(() => {
                const subTotal = (Number(formData.qty) || 0) * (Number(formData.price) || 0);
                return subTotal - (Number(formData.discount) || 0);
            }, [formData.qty, formData.price, formData.discount]);

            const grandTotals = useMemo(() => orderItems.reduce((acc, curr) => ({ qty: acc.qty + (Number(curr.qty) || 0), amount: acc.amount + (Number(curr.total) || 0) }), { qty: 0, amount: 0 }), [orderItems]);

            // Auto-fill price for Stock Out
            useEffect(() => {
                if (!formData.product || !formData.warehouse || activeTab !== 'out') return;
                if (isNetMode) { const avgNonGST = Number(itemStats.avgNonGST) || 0; setFormData(prev => ({ ...prev, price: avgNonGST > 0 ? avgNonGST.toString() : '' })); }
                else { const avgGST = Number(itemStats.avgGST) || 0; setFormData(prev => ({ ...prev, price: avgGST > 0 ? avgGST.toString() : '' })); }
            }, [formData.product, formData.billType, formData.warehouse, activeTab]);

            const saveNetRateToMaster = (mill, product, warehouse, netRate) => {
                if (typeof google === 'undefined') return;
                const payload = { action: 'STOCK_IN', date: formData.date, warehouse: warehouse, billType: 'NON-GST', items: [{ mill, product, qty: 0, price: netRate, billType: 'NON-GST', unit: 'Ream' }] };
                google.script.run.withSuccessHandler(() => Toast.fire({ icon: 'success', title: '✅ Rate saved to Master!' })).withFailureHandler(err => Toast.fire({ icon: 'error', title: err.message })).processData(JSON.stringify(payload));
            };

            // ── Add item to order list ───────────────────────────────────────────
            const addItemToList = () => {
                if (!formData.product) return Toast.fire({ icon: 'warning', title: 'Select product!' });
                if (!formData.qty || Number(formData.qty) <= 0) return Toast.fire({ icon: 'error', title: 'Sahi Quantity bhariye!' });

                // Transfer: validate rate only
                if (activeTab === 'transfer') {
                    if (!formData.price || Number(formData.price) <= 0) return Toast.fire({ icon: 'error', title: 'Transfer Rate zaroori hai!' });
                    const newItem = { ...formData, id: Date.now(), total: 0, billType: 'GST', rate: formData.price };
                    setOrderItems([...orderItems, newItem]);
                    setFormData({ ...formData, product: '', mill: '', price: '', qty: '' });
                    setSearchQuery('');
                    Toast.fire({ icon: 'success', title: '🔄 Item Added' });
                    return;
                }

                // NET mode (Stock Out NON-GST)
                if (isNetMode && activeTab === 'out') {
                    const salePrice = Number(formData.price) || 0;
                    if (salePrice <= 0) return Toast.fire({ icon: 'error', title: 'Enter Net Rate!' });
                    const existingCostPrice = Number(itemStats.avgNonGST) || 0;
                    if (existingCostPrice === 0) {
                        Swal.fire({
                            title: '💰 Cost Price (Net)',
                            html: `<div style="text-align:left;font-size:13px;margin-bottom:12px;color:#444"><b style="color:#1a5c2a">${formData.mill} — ${formData.product}</b><br><br><div style="display:flex;justify-content:space-between;background:#f0f5ec;padding:10px;border-radius:8px;margin-bottom:8px"><span style="color:#666">Sale Price:</span><b style="color:#1a5c2a">₹${salePrice}</b></div><span style="color:#d97706;font-size:12px">⚠️ Is product ka Cost Price saved nahi hai. MasterStock update ke liye daale:</span></div><input id="swal-cost-price" class="swal2-input" type="number" placeholder="Cost Price (₹)" min="1" style="font-size:18px;font-weight:700;text-align:center;border:2px solid #d97706">`,
                            confirmButtonText: '✅ Save Cost & Add',
                            confirmButtonColor: '#1a5c2a',
                            showCancelButton: true,
                            cancelButtonText: '✕ Close',
                            cancelButtonColor: '#94a3b8',
                            allowOutsideClick: true,
                            allowEscapeKey: true,
                            focusConfirm: false,
                            background: '#fffbeb',
                            preConfirm: () => { const val = Number(document.getElementById('swal-cost-price').value); if (!val || val <= 0) { Swal.showValidationMessage('Cost Price daalna zaroori hai!'); return false; } return val; }
                        }).then(result => {
                            if (!result.isConfirmed) return;
                            saveNetRateToMaster(formData.mill, formData.product, formData.warehouse, result.value);
                            const total = (Number(formData.qty) || 0) * salePrice;
                            const newItem = { ...formData, id: Date.now(), total, billType: 'NON-GST', rate: formData.price };
                            setOrderItems(prev => [...prev, newItem]);
                            setFormData({ ...formData, product: '', mill: '', price: '', qty: '', discount: '0', insurance: '0', cartage: '0', loading: '0' });
                            setSearchQuery('');
                            Toast.fire({ icon: 'success', title: '🟡 Added + Cost Saved!' });
                        });
                        return;
                    }
                }

                // Normal Stock In / Stock Out
                if (!formData.price || Number(formData.price) <= 0) return Toast.fire({ icon: 'error', title: 'Price zaroori hai!' });
                const newItem = { ...formData, id: Date.now(), total: currentTotal, rate: formData.price };
                setOrderItems([...orderItems, newItem]);
                setFormData({ ...formData, product: '', mill: '', price: '', qty: '', discount: '0', insurance: '0', cartage: '0', loading: '0' });
                setSearchQuery('');
                Toast.fire({ icon: 'success', title: newItem.billType === 'NON-GST' ? '🟡 Item Added' : '✅ Item Added' });
            };

            const removeItem = (id) => { setOrderItems(orderItems.filter(item => item.id !== id)); Toast.fire({ icon: 'info', title: 'Removed' }); };

            // ── Submit transaction ───────────────────────────────────────────────
            const handleSubmit = (action) => {
                if (action === 'STOCK_OUT' && (!formData.padNo || !formData.partyName || !formData.salesPerson)) return Toast.fire({ icon: 'warning', title: 'Party, Pad No & Sales Person Must!' });
                if (action === 'TRANSFER' && (!formData.toWarehouse || formData.warehouse === formData.toWarehouse)) return Toast.fire({ icon: 'warning', title: 'Invalid Destination!' });
                if (orderItems.length === 0) return Toast.fire({ icon: 'error', title: 'Add atleast 1 item!' });
                setBtn('saveTxn', true);
                const effectiveBillNo = isNetMode ? (formData.netBillNo || '') : formData.billNo;
                const payload = {
                    ...formData, action,
                    billNo: effectiveBillNo,
                    partyName: (formData.partyName || '').toUpperCase().trim(),
                    items: orderItems.map(item => ({ ...item, rate: item.price }))
                };
                google.script.run
                    .withSuccessHandler(res => {
                        if (res.status === 'success') {
                            Toast.fire({ icon: 'success', title: res.message });
                            setOrderItems([]);
                            setFormData({ ...formData, product: '', qty: '', price: '', padNo: '', billNo: '', netBillNo: '', freight: '0', discount: '0', billType: 'GST', insurance: '0', cartage: '0', loading: '0', toWarehouse: '' });
                            setPartySearch(''); refreshData();
                        } else Toast.fire({ icon: 'error', title: res.message });
                        setBtn('saveTxn', false);
                    })
                    .withFailureHandler(err => { setBtn('saveTxn', false); Toast.fire({ icon: 'error', title: err.message }); })
                    .processData(JSON.stringify(payload));
            };

            // ── Modify ───────────────────────────────────────────────────────────
            const handleModifySearch = () => {
                if (!modifyParty && !modifyProduct && !modifyFromDate && !modifyToDate) return Toast.fire({ icon: 'warning', title: 'Enter search filters!' });
                setBtn('modifySearch', true); setEditingRow(null);
                google.script.run.withSuccessHandler(res => {
                    let data = []; try { data = JSON.parse(res); } catch(e) {}
                    setModifyResults(data); setBtn('modifySearch', false);
                    if (data.length === 0) Toast.fire({ icon: 'info', title: 'No records found!' }); else Toast.fire({ icon: 'success', title: data.length + ' records found' });
                }).withFailureHandler(err => { setBtn('modifySearch', false); Toast.fire({ icon: 'error', title: err.message }); }).searchRecords(modifySheet, modifyParty, modifyProduct, modifyFromDate || '', modifyToDate || '');
            };

            const startEditing = (row) => {
                setEditingRow(row);
                const vals = {}; Object.keys(row).forEach(k => { if (k !== '_sheetRow' && k !== '_sheetName' && k !== 'Date') vals[k] = row[k]; });
                setEditValues(vals);
            };

            const handleEditValueChange = (key, value) => {
                const newVals = { ...editValues, [key]: value };
                if (modifySheet === 'SalesLog') {
                    if (['Qty', 'Rate', 'Discount', 'Freight', 'Recovered?', 'Cost Price'].includes(key)) {
                        const qty = Number(newVals['Qty']) || 0, rate = Number(newVals['Rate']) || 0, disc = Number(newVals['Discount']) || 0;
                        const amt = (qty * rate) - disc; newVals['Amount'] = amt;
                        const freight = Number(newVals['Freight']) || 0, isRec = String(newVals['Recovered?']).toLowerCase().trim() === 'yes', cp = Number(newVals['Cost Price']) || 0;
                        newVals['Profit'] = Number((amt - (qty * cp) - (isRec ? 0 : freight)).toFixed(2));
                    }
                }
                if (modifySheet === 'PurchaseLog') {
                    if (['Qty', 'Price'].includes(key)) newVals['Amount'] = (Number(newVals['Qty']) || 0) * (Number(newVals['Price']) || 0);
                }
                setEditValues(newVals);
            };

            const saveEdit = () => {
                if (!editingRow || !editingRow._sheetRow) return;
                setBtn('saveEdit', true);
                const actualSheet = editingRow._sheetName || modifySheet;
                google.script.run.withSuccessHandler(res => {
                    if (res.status === 'success') { Toast.fire({ icon: 'success', title: res.message }); setEditingRow(null); handleModifySearch(); refreshData(); }
                    else Toast.fire({ icon: 'error', title: res.message });
                    setBtn('saveEdit', false);
                }).withFailureHandler(err => { setBtn('saveEdit', false); Toast.fire({ icon: 'error', title: err.message }); }).updateRecord(actualSheet, editingRow._sheetRow, JSON.stringify(editValues));
            };

            const deleteEntry = (row) => {
                Swal.fire({ title: 'Are you sure?', text: "Permanent delete!", icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', cancelButtonColor: '#64748b', confirmButtonText: 'Yes, Delete!', background: '#0f172a', color: '#fff' }).then(result => {
                    if (result.isConfirmed) {
                        const actualSheet = row._sheetName || modifySheet;
                        google.script.run.withSuccessHandler(res => {
                            if (res.status === 'success') { Toast.fire({ icon: 'success', title: res.message }); handleModifySearch(); refreshData(); }
                            else Toast.fire({ icon: 'error', title: res.message });
                        }).withFailureHandler(err => Toast.fire({ icon: 'error', title: err.message })).deleteRecord(actualSheet, row._sheetRow);
                    }
                });
            };

            const isAutoCalcField = (key) => (modifySheet === 'SalesLog' && (key === 'Amount' || key === 'Profit')) || (modifySheet === 'PurchaseLog' && key === 'Amount');

            // ── Split-group detection for Modify > SalesLog ─────────────────────
            const modifyGroupInfo = useMemo(() => {
                if (modifySheet !== 'SalesLog' || modifyResults.length === 0) return {};
                const keyOf = (row) => ['Date','Pad No.','Bill No.','Party Name','Mills','Product','Warehouse','Bill Type']
                    .map(k => (row[k] !== undefined ? row[k] : '')).join('||');
                const groups = {};
                modifyResults.forEach((row, idx) => {
                    const k = keyOf(row);
                    if (!groups[k]) groups[k] = [];
                    groups[k].push(idx);
                });
                const info = {};
                Object.values(groups).forEach((indices, gIdx) => {
                    if (indices.length > 1) {
                        indices.forEach((idx, partIdx) => {
                            info[idx] = { groupIdx: gIdx, part: partIdx + 1, total: indices.length };
                        });
                    }
                });
                return info;
            }, [modifyResults, modifySheet]);

            const modifyResultColumns = useMemo(() => {
                if (modifyResults.length === 0) return [];
                const seen = new Set(); const ordered = [];
                modifyResults.forEach(row => { Object.keys(row).forEach(k => { if (k.startsWith('_')) return; if (!seen.has(k)) { seen.add(k); ordered.push(k); } }); });
                return ordered;
            }, [modifyResults]);

            const logModalColumns = useMemo(() => {
                if (!logModal.data || logModal.data.length === 0) return [];
                const seen = new Set(); const ordered = [];
                logModal.data.forEach(row => { Object.keys(row).forEach(k => { if (k.startsWith('_')) return; if (!seen.has(k)) { seen.add(k); ordered.push(k); } }); });
                return ordered;
            }, [logModal.data]);

            const freightDistribution = useMemo(() => {
                const totalFreight = Number(formData.freight) || 0, totalQty = orderItems.reduce((sum, item) => sum + (Number(item.qty) || 0), 0);
                if (totalFreight <= 0 || totalQty <= 0) return {};
                const dist = {}; let runningSum = 0;
                orderItems.forEach((item, idx) => {
                    if (idx === orderItems.length - 1) dist[item.id] = Math.round((totalFreight - runningSum) * 100) / 100;
                    else { const share = Math.round((Number(item.qty) / totalQty) * totalFreight * 100) / 100; dist[item.id] = share; runningSum += share; }
                });
                return dist;
            }, [orderItems, formData.freight]);

            const groupedLedger = useMemo(() => {
                const grouped = {};
                ledgerData.forEach(row => {
                    const dKey = row.dateSort || row.date;
                    if (!grouped[dKey]) grouped[dKey] = { date: row.date, warehouses: {} };
                    if (!grouped[dKey].warehouses[row.warehouse]) grouped[dKey].warehouses[row.warehouse] = [];
                    grouped[dKey].warehouses[row.warehouse].push(row);
                });
                return grouped;
            }, [ledgerData]);

            const tabs = [
                { id: 'dashboard', icon: '📊', label: 'Dashboard', short: 'Dash' },
                { id: 'in', icon: '📥', label: 'Stock In', short: 'In' },
                { id: 'out', icon: '📤', label: 'Stock Out', short: 'Out' },
                { id: 'transfer', icon: '🔄', label: 'Transfer', short: 'Trans' },
                { id: 'history', icon: '📅', label: 'History', short: 'History' },
                { id: 'modify', icon: '✏️', label: 'Modify', short: 'Modify' },
                { id: 'report', icon: '📜', label: 'Stock Book', short: 'Book' },
                { id: 'search', icon: '🔍', label: 'Search', short: 'Search' },
                { id: 'partyreport', icon: '👤', label: 'Party Report', short: 'Party' },
            ];

            const switchTab = (id) => { setActiveTab(id); setOrderItems([]); setFormData(prev => ({ ...prev, product: '', qty: '', price: '', warehouse: '', toWarehouse: '', mill: '', billType: 'GST', billNo: '', netBillNo: '', partyName: '', padNo: '', discount: '0', freight: '0', freightRecovered: 'No', insurance: '0', cartage: '0', loading: '0' })); setSearchQuery(''); setPartySearch(''); };

            return (
                <div className="flex h-screen overflow-hidden text-slate-900 bg-slate-50 flex-col">
                    {!isConfigured && (
                        <div className="api-banner flex items-center justify-center gap-2">
                            <span>⚠️ <b>Configuration Required:</b> Please set your Google Apps Script Web App URL in <code>index.html</code> (line 46) to connect to Google Sheets.</span>
                        </div>
                    )}

                    <div className="flex flex-1 overflow-hidden">
                        {/* Mobile header */}
                        <div className="mobile-header fixed top-0 left-0 right-0 z-[150] bg-[#0f172a] px-4 py-3 items-center justify-between shadow-lg">
                            <div className="flex items-center gap-2">
                                <img src={LOGO_URL} alt="Logo" className="w-8 h-8 rounded-full border border-blue-500 object-cover" onError={e => { e.target.style.display = 'none'; }} />
                                <span className="text-white font-black text-sm italic uppercase tracking-tight">SATIJA PAPER</span>
                            </div>
                        </div>

                        {/* Mobile nav */}
                        <div className="mobile-nav flex-row items-center justify-around py-2 px-1 border-t border-slate-800 gap-2">
                            {tabs.filter(t => ['dashboard', 'in', 'out', 'transfer', 'report'].includes(t.id)).map(tab => (
                                <button key={tab.id} onClick={() => switchTab(tab.id)} className={`flex flex-col items-center gap-0.5 px-2 py-1 rounded-lg text-[9px] font-bold transition ${activeTab === tab.id ? 'bg-blue-600 text-white' : 'text-slate-500'}`}>
                                    <span className="text-base">{tab.icon}</span><span>{tab.short}</span>
                                </button>
                            ))}
                        </div>

                        {/* Sidebar */}
                        <aside className="sidebar-desktop w-72 bg-[#0f172a] text-slate-400 flex flex-col shadow-2xl z-[100]">
                            <div className="p-6 text-center border-b border-slate-800">
                                <img src={LOGO_URL} alt="Satija Paper Logo" className="w-16 h-16 mx-auto mb-2 rounded-full object-cover border-2 border-blue-500 shadow-lg shadow-blue-500/30" onError={e => { e.target.style.display = 'none'; }} />
                                <h1 className="text-white font-black text-xl italic tracking-tighter uppercase">SATIJA PAPER</h1>
                            </div>
                            <nav className="flex-1 px-4 mt-4 space-y-1 overflow-y-auto custom-scroll pb-6">
                                {tabs.map(tab => (
                                    <button key={tab.id} onClick={() => switchTab(tab.id)} className={`w-full text-left px-4 py-3 font-bold transition rounded-lg ${activeTab === tab.id ? 'sidebar-active' : 'hover:text-white'}`}>
                                        {tab.icon} {tab.label}
                                    </button>
                                ))}
                            </nav>
                        </aside>

                        <main className="flex-1 p-8 overflow-y-auto custom-scroll" style={{ paddingTop: window.innerWidth < 769 ? '4rem' : undefined }}>

                            {/* ── DASHBOARD ── */}
                            {activeTab === 'dashboard' && (
                                <div className="max-w-6xl mx-auto space-y-8">
                                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                        <div className="md:col-span-2 bg-gradient-to-br from-blue-600 to-blue-800 p-6 rounded-2xl text-white shadow-lg">
                                            <p className="text-[10px] font-black uppercase tracking-widest opacity-70">Total Inventory Value</p>
                                            <h2 className="text-4xl font-black mt-1">₹{n2(dashData.totalValue, true)}</h2>
                                            <p className="text-[10px] opacity-60 mt-2">{dashData.items.length} products across {WAREHOUSES.length} warehouses</p>
                                        </div>
                                        <div className="bg-white rounded-2xl p-4 border border-slate-100 shadow-sm flex flex-col justify-between">

                                                        google.script.run.withSuccessHandler(res => {
                                                            try {
                                                                const data = JSON.parse(res);
                                                                const partyKey = data.length > 0 ? Object.keys(data[0]).find(k => k.toLowerCase().replace(/\s/g, '').includes('partyname') || k.toLowerCase() === 'party') : null;
                                                                const qtyKey = data.length > 0 ? Object.keys(data[0]).find(k => k.toLowerCase() === 'qty' || k.toLowerCase() === 'quantity') : 'Qty';
                                                                const amtKey = data.length > 0 ? Object.keys(data[0]).find(k => k.toLowerCase() === 'amount') : 'Amount';
                                                                const profitKey = data.length > 0 ? Object.keys(data[0]).find(k => k.toLowerCase() === 'profit') : 'Profit';
                                                                const grouped = {};
                                                                data.forEach(row => {
                                                                    const party = (partyKey ? row[partyKey] : null) || 'Unknown';
                                                                    if (!grouped[party]) grouped[party] = { party, totalQty: 0, totalAmt: 0, totalProfit: 0, bills: 0 };
                                                                    grouped[party].totalQty += Number(qtyKey ? row[qtyKey] : 0) || 0;
                                                                    grouped[party].totalAmt += Number(amtKey ? row[amtKey] : 0) || 0;
                                                                    grouped[party].totalProfit += Number(profitKey ? row[profitKey] : 0) || 0;
                                                                    grouped[party].bills++;
                                                                });
                                                                setPartyReport(Object.values(grouped).sort((a, b) => b.totalAmt - a.totalAmt));
                                                            } catch(e) {}
                                                            setPartyRepLoading(false);
                                                        }).withFailureHandler(err => { setPartyRepLoading(false); Toast.fire({ icon: 'error', title: err.message }); }).searchRecords('SalesLog', partyRepFilters.party, '', partyRepFilters.from, partyRepFilters.to);
                                                    }
                                                }} className={`w-full p-3 bg-blue-600 text-white rounded-xl font-black uppercase shadow-lg text-sm ${partyRepLoading ? 'btn-spin' : ''}`}>
                                                    {partyRepLoading ? 'Loading...' : 'Load Report 📊'}
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                    {partyReport.length > 0 && (
                                        <div className="bg-white rounded-[2rem] border border-slate-100 overflow-hidden shadow-xl">
                                            <div className="bg-slate-900 p-4 px-8 flex justify-between items-center flex-wrap gap-2">
                                                <h3 className="text-white font-black italic tracking-widest uppercase text-sm">Party Report <span className="text-blue-400">({partyReport.length} parties)</span></h3>
                                                <button onClick={downloadPartyReportExcel} className="bg-emerald-600 hover:bg-emerald-800 text-white px-4 py-1.5 rounded-full text-[10px] font-black uppercase shadow-lg transition">Download Excel ⬇</button>
                                            </div>
                                            <div className="scroll-top-table">
                                                <table className="w-full text-left text-[11px] font-bold uppercase border-collapse">
                                                    <thead className="bg-slate-50 text-slate-400 text-[9px] font-black">
                                                        <tr><th className="p-4">#</th><th>Party Name</th><th className="text-center">Bills</th><th className="text-center">Total Qty</th><th className="text-right">Total Amount</th><th className="text-right">Total Profit</th></tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-100">
                                                        {partyReport.map((p, i) => (
                                                            <tr key={i} className="hover:bg-blue-50/40 transition">
                                                                <td className="p-4 text-slate-400 font-black">{i + 1}</td>
                                                                <td className="p-4 font-black text-slate-800">{p.party}</td>
                                                                <td className="p-4 text-center">{p.bills}</td>
                                                                <td className="p-4 text-center text-blue-600">{n2(p.totalQty)}</td>
                                                                <td className="p-4 text-right">₹{n2(p.totalAmt, true)}</td>
                                                                <td className={`p-4 text-right ${p.totalProfit >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>₹{n2(p.totalProfit, true)}</td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
